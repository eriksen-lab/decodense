[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "decodense"
version = "1.0.0"
authors = [{ name = "Dr. Janus Juul Eriksen", email = "Janus@dtu.dk" }]
description = "A Python package for decomposing HF and KS-DFT mean-field theory"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy",
    "pandas",
    "pyscf",
    "scipy",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/eriksen-lab/decodense" 
Issues = "https://github.com/eriksen-lab/decodense/issues"

[tool.black]
line-length = 88
